<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sh1meeeeer • Профиль Instagram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="insta-nav">
        <div class="nav-content">
            <span class="logo">Sh1meeeeer</span>
            <div class="nav-links">
                <a href="index.html" class="active">Профиль</a>
                <a href="index2.html">Библиотека</a>
                <button id="theme-toggle" class="theme-btn">🌙</button>
            </div>
        </div>
    </nav>

    <main class="insta-container">
        <div class="profile-layout">
            
            <div class="avatar-col">
                <div class="avatar-story-ring">
                    <div class="avatar-inner">
                        <img src="img/images.jpeg" alt="Sh1meeeeer">
                    </div>
                </div>
            </div>

            <div class="info-col">
                <div class="username-row">
                    <h1 class="username">Sh1meeeeer</h1>
                    <button class="edit-btn">Подписаться</button>
                </div>

                <div class="stats-row">
                    <div class="stat-item"><strong>3</strong> публикации</div>
                    <div class="stat-item"><strong>1 000</strong> подписчиков</div>
                    <div class="stat-item"><strong>5</strong> подписок</div>
                </div>

                <div class="bio-row">
                    <h2>Назар П.</h2>
                    <p class="bio-text">Возраст: 16 лет</p>
                    <p class="bio-location">📍 Город: Астана</p>
                </div>
            </div>

        </div>
    </main>

    <footer class="insta-footer">
        <div class="footer-links">
            <a href="#">Telegram</a>
            <a href="#">GitHub</a>
            <a href="#">Контакты</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
